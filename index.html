<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anggaran.me - Dashboard</title>
    <!-- Styling & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Pop-ups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap');

        body {
            /* Font Figtree khas Laravel */
            font-family: 'Figtree', sans-serif;
            background-color: #f8fafc;
        }

        .glass {
            background: #ffffff;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .modal-active {
            display: flex !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* SweetAlert kaku ala dashboard admin */
        .swal2-popup {
            border-radius: 0.75rem !important;
        }

        /* Animasi Pop-up */
        @keyframes scaleIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-scaleIn {
            animation: scaleIn 0.2s ease-out forwards;
        }
    </style>
</head>

<body class="text-slate-800 h-screen flex flex-col relative overflow-hidden">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm p-4 z-10 flex justify-between items-center px-6">
        <h1 class="text-xl font-bold tracking-tight text-slate-800 flex items-center">
            anggaran.me
        </h1>
        <!-- Tombol untuk export/import bisa diletakkan di sini nantinya jika diperlukan -->
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-8 pb-24" id="main-container">
        <!-- Tampilan Kosong -->
        <div id="empty-state" class="hidden flex-col items-center justify-center h-full text-slate-400">
            <div class="bg-slate-100 p-6 rounded-lg mb-4 border border-slate-200">
                <i class="fas fa-box-open text-4xl text-slate-400"></i>
            </div>
            <p class="text-lg font-semibold text-slate-600">Data Kosong</p>
            <p class="text-sm mt-1">Tambahkan anggaran baru untuk memulai.</p>
        </div>

        <!-- Grid Anggaran -->
        <div id="budget-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 max-w-7xl mx-auto">
            <!-- Kartu anggaran dinamis -->
        </div>
    </main>

    <!-- Tombol Float (FAB) -->
    <button id="btn-add-budget"
        class="fixed bottom-8 right-8 bg-indigo-600 text-white w-14 h-14 rounded-xl shadow-md border border-indigo-700 flex items-center justify-center text-xl hover:bg-indigo-700 transition-colors z-20">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Pop-up Modal Detail Anggaran (Posisi Selalu di Tengah) -->
    <div id="modal-detail"
        class="hidden fixed inset-0 bg-slate-900/60 z-50 items-center justify-center p-4 backdrop-blur-sm transition-all">
        <div
            class="glass w-full max-w-4xl rounded-xl flex flex-col max-h-[90vh] overflow-hidden animate-scaleIn border border-slate-200">

            <!-- Header Modal -->
            <div class="p-5 border-b border-slate-200 flex justify-between items-center bg-white relative">
                <div class="flex items-center gap-3">
                    <h2 class="text-xl font-bold text-slate-800" id="detail-title">Detail Anggaran</h2>
                    <!-- Tombol Edit & Hapus Anggaran Utama -->
                    <div class="flex bg-slate-100 rounded-lg p-0.5 border border-slate-200 ml-2">
                        <button id="btn-edit-budget"
                            class="text-slate-500 hover:text-indigo-600 hover:bg-white px-2.5 py-1 rounded-md text-sm transition"
                            title="Edit Info Anggaran">
                            <i class="fas fa-edit"></i>
                        </button>
                        <div class="w-px bg-slate-300 mx-0.5 my-1"></div>
                        <button id="btn-delete-budget"
                            class="text-slate-500 hover:text-rose-600 hover:bg-white px-2.5 py-1 rounded-md text-sm transition"
                            title="Hapus Anggaran Ini">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>

                <button id="btn-close-modal"
                    class="text-slate-400 hover:text-rose-600 transition h-8 w-8 flex items-center justify-center rounded-md hover:bg-rose-50 border border-transparent hover:border-rose-100 ml-2 shrink-0">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="p-5 flex-1 overflow-y-auto bg-slate-50">
                <!-- Rangkuman Keuangan -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <div
                        class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between relative overflow-hidden">
                        <div class="absolute -right-6 -top-6 text-slate-100 opacity-50"><i
                                class="fas fa-money-bill-wave text-7xl"></i></div>
                        <div class="relative z-10">
                            <p class="text-[11px] text-slate-500 font-bold tracking-wider mb-1">DANA AWAL</p>
                            <p class="text-2xl font-bold text-slate-800" id="detail-initial">Rp 0</p>
                        </div>
                    </div>

                    <div id="detail-remaining-card"
                        class="bg-indigo-600 p-5 rounded-xl border border-indigo-700 shadow-sm text-white flex flex-col justify-between">
                        <div>
                            <p class="text-[11px] text-indigo-200 font-bold tracking-wider mb-1">SISA ANGGARAN</p>
                            <p class="text-2xl font-bold" id="detail-remaining">Rp 0</p>
                        </div>
                        <div class="mt-4">
                            <div id="detail-percent-text"
                                class="flex justify-between text-xs font-semibold mb-1.5 text-indigo-100 tracking-wide">
                                <span>Tersisa 0%</span>
                            </div>
                            <div class="w-full bg-indigo-800 rounded-md h-1.5">
                                <div id="detail-progress-bar" class="bg-white h-1.5 rounded-md" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Daftar Penggunaan -->
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-700 text-lg">Rincian Penggunaan</h3>
                    <button id="btn-add-expense"
                        class="bg-white border border-slate-300 text-slate-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-50 hover:text-indigo-600 transition shadow-sm">
                        <i class="fas fa-plus mr-1"></i> Tambah Item
                    </button>
                </div>

                <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                    <ul id="expense-list" class="divide-y divide-slate-100">
                        <!-- List Item -->
                    </ul>
                    <div id="empty-expense"
                        class="p-10 flex flex-col items-center justify-center text-slate-400 hidden">
                        <i class="fas fa-receipt text-3xl mb-3 text-slate-300"></i>
                        <p class="text-sm font-medium">Belum ada pengeluaran dicatat.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript - Local Storage Logic -->
    <script>
        // Key untuk Local Storage
        const STORAGE_KEY = 'anggaran_me_data';

        let currentBudgetId = null;
        let budgetsData = {};

        // Inisialisasi Data dari Local Storage
        const loadData = () => {
            const savedData = localStorage.getItem(STORAGE_KEY);
            if (savedData) {
                budgetsData = JSON.parse(savedData);
            } else {
                budgetsData = {};
            }
            renderDashboard();
        };

        // Simpan Data ke Local Storage
        const saveData = () => {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(budgetsData));
            renderDashboard(); // Render ulang setelah menyimpan
            if (currentBudgetId) renderExpenses(currentBudgetId); // Render ulang popup jika terbuka
        };

        // Generate Random ID 
        const generateId = () => {
            return 'id_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
        };

        const emptyState = document.getElementById('empty-state');
        const budgetList = document.getElementById('budget-list');
        const modalDetail = document.getElementById('modal-detail');

        const formatRp = (angka) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        };

        const attachNumberFormatEvent = () => {
            const inputs = document.querySelectorAll('.format-angka');
            inputs.forEach(input => {
                input.addEventListener('input', function (e) {
                    let val = this.value.replace(/[^0-9]/g, '');
                    this.value = val ? new Intl.NumberFormat('id-ID').format(val) : '';
                });
            });
        };

        // Render Halaman Utama
        const renderDashboard = () => {
            budgetList.innerHTML = '';

            if (Object.keys(budgetsData).length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                for (const [id, data] of Object.entries(budgetsData)) {
                    let totalUsed = 0;
                    if (data.expenses) {
                        Object.values(data.expenses).forEach(exp => {
                            totalUsed += (exp.qty * exp.price);
                        });
                    }
                    const remaining = data.initialFund - totalUsed;
                    const percentageUsed = data.initialFund > 0 ? (totalUsed / data.initialFund) * 100 : 0;
                    const remainingPercentage = data.initialFund > 0 ? Math.max(0, 100 - percentageUsed).toFixed(1) : 0;
                    const progressWidth = Math.min(percentageUsed, 100);

                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between hover:border-indigo-300 transition-colors cursor-pointer group relative overflow-hidden";
                    card.innerHTML = `
                        <div class="absolute -right-4 -top-4 w-16 h-16 bg-slate-50 rounded-full z-0 group-hover:bg-indigo-50 transition-colors"></div>
                        <div class="relative z-10">
                            <div class="flex justify-between items-start mb-4">
                                <h3 class="text-lg font-bold text-slate-800 group-hover:text-indigo-600 transition pr-6 line-clamp-1">${data.name}</h3>
                                <div class="text-slate-300 group-hover:text-indigo-600 transition"><i class="fas fa-chevron-right text-sm"></i></div>
                            </div>
                            <div class="space-y-3">
                                <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                                    <span class="text-sm font-medium text-slate-500">Dana Awal</span> 
                                    <span class="font-bold text-slate-700">${formatRp(data.initialFund)}</span>
                                </div>
                                
                                <div>
                                    <div class="flex justify-between text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1.5">
                                        <span>Progres</span>
                                        <span class="${remaining < 0 ? 'text-rose-500' : 'text-indigo-600'}">Sisa ${remaining < 0 ? '0' : remainingPercentage}%</span>
                                    </div>
                                    <div class="w-full bg-slate-100 rounded-sm h-1.5 overflow-hidden">
                                        <div class="${remaining < 0 ? 'bg-rose-500' : 'bg-indigo-500'} h-1.5 rounded-sm transition-all duration-500" style="width: ${progressWidth}%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-5 pt-4 border-t border-slate-100 relative z-10">
                            <p class="text-[11px] text-slate-400 font-bold tracking-wider mb-0.5 uppercase">Sisa Dana</p>
                            <p class="text-xl font-bold ${remaining < 0 ? 'text-rose-600' : 'text-slate-800'}">${formatRp(remaining)}</p>
                        </div>
                    `;
                    card.onclick = () => openDetail(id);
                    budgetList.appendChild(card);
                }
            }
        };

        // ==========================================
        // EVENT: ANGGARAN UTAMA (TAMBAH, EDIT, HAPUS)
        // ==========================================

        document.getElementById('btn-add-budget').addEventListener('click', () => {
            Swal.fire({
                title: '<span class="text-xl font-bold">Anggaran Baru</span>',
                html: `
                    <div class="text-left mt-4 space-y-4">
                        <div>
                            <label class="text-sm font-semibold text-slate-700">Nama Anggaran</label>
                            <input id="swal-b-name" class="swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300 focus:border-indigo-500" placeholder="Contoh: Event Kemerdekaan">
                        </div>
                        <div>
                            <label class="text-sm font-semibold text-slate-700">Dana Awal (Rp)</label>
                            <input id="swal-b-fund" type="text" inputmode="numeric" class="format-angka swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300 focus:border-indigo-500" placeholder="1.500.000">
                        </div>
                    </div>
                `,
                didOpen: attachNumberFormatEvent,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Simpan',
                cancelButtonText: 'Batal',
                customClass: { confirmButton: '!bg-indigo-600 !rounded-lg !px-6', cancelButton: '!bg-white !text-slate-700 !border !border-slate-300 !rounded-lg !px-6 hover:!bg-slate-50' },
                preConfirm: () => {
                    const name = document.getElementById('swal-b-name').value;
                    const fundStr = document.getElementById('swal-b-fund').value.replace(/\./g, '');
                    if (!name || !fundStr) Swal.showValidationMessage('Isi semua kolom wajib!');
                    return { name, fund: parseInt(fundStr) }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const id = generateId();
                    budgetsData[id] = {
                        name: result.value.name,
                        initialFund: result.value.fund,
                        createdAt: Date.now(),
                        expenses: {}
                    };
                    saveData();
                }
            });
        });

        document.getElementById('btn-edit-budget').addEventListener('click', () => {
            if (!currentBudgetId || !budgetsData[currentBudgetId]) return;
            const currentData = budgetsData[currentBudgetId];

            Swal.fire({
                title: '<span class="text-xl font-bold">Edit Info Anggaran</span>',
                html: `
                    <div class="text-left mt-4 space-y-4">
                        <div>
                            <label class="text-sm font-semibold text-slate-700">Nama Anggaran</label>
                            <input id="swal-b-name-edit" class="swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300" value="${currentData.name}">
                        </div>
                        <div>
                            <label class="text-sm font-semibold text-slate-700">Dana Awal (Rp)</label>
                            <input id="swal-b-fund-edit" type="text" inputmode="numeric" class="format-angka swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300" value="${new Intl.NumberFormat('id-ID').format(currentData.initialFund)}">
                        </div>
                    </div>
                `,
                didOpen: attachNumberFormatEvent,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Simpan Perubahan',
                cancelButtonText: 'Batal',
                customClass: { confirmButton: '!bg-indigo-600 !rounded-lg !px-6', cancelButton: '!bg-white !text-slate-700 !border !border-slate-300 !rounded-lg !px-6 hover:!bg-slate-50' },
                preConfirm: () => {
                    const name = document.getElementById('swal-b-name-edit').value;
                    const fundStr = document.getElementById('swal-b-fund-edit').value.replace(/\./g, '');
                    if (!name || !fundStr) Swal.showValidationMessage('Isi semua kolom wajib!');
                    return { name, initialFund: parseInt(fundStr) }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    budgetsData[currentBudgetId].name = result.value.name;
                    budgetsData[currentBudgetId].initialFund = result.value.initialFund;
                    saveData();
                }
            });
        });

        document.getElementById('btn-delete-budget').addEventListener('click', () => {
            if (!currentBudgetId) return;
            Swal.fire({
                title: 'Hapus Anggaran Ini?',
                text: "Semua data pemakaian di dalamnya juga akan terhapus permanen.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, Hapus Semua',
                cancelButtonText: 'Batal',
                customClass: { confirmButton: '!bg-rose-600 !rounded-lg !px-5', cancelButton: '!bg-white !text-slate-700 !border !border-slate-300 !rounded-lg !px-5 hover:!bg-slate-50' }
            }).then((result) => {
                if (result.isConfirmed) {
                    delete budgetsData[currentBudgetId];
                    modalDetail.classList.remove('modal-active');
                    currentBudgetId = null;
                    saveData();
                }
            });
        });

        // ==========================================
        // FUNGSI POP-UP & RINCIAN PEMAKAIAN
        // ==========================================

        function openDetail(id) {
            currentBudgetId = id;
            modalDetail.classList.add('modal-active');
            renderExpenses(id);
        }

        document.getElementById('btn-close-modal').addEventListener('click', () => {
            modalDetail.classList.remove('modal-active');
            currentBudgetId = null;
        });

        function renderExpenses(budgetId) {
            const budget = budgetsData[budgetId];
            if (!budget) return modalDetail.classList.remove('modal-active');

            document.getElementById('detail-title').innerText = budget.name;
            document.getElementById('detail-initial').innerText = formatRp(budget.initialFund);

            let totalUsed = 0;
            const expenseList = document.getElementById('expense-list');
            const emptyExp = document.getElementById('empty-expense');
            expenseList.innerHTML = '';

            if (!budget.expenses || Object.keys(budget.expenses).length === 0) {
                emptyExp.classList.remove('hidden');
            } else {
                emptyExp.classList.add('hidden');
                for (const [expId, exp] of Object.entries(budget.expenses)) {
                    const subtotal = exp.qty * exp.price;
                    totalUsed += subtotal;

                    const li = document.createElement('li');
                    li.className = "p-4 hover:bg-slate-50 transition flex flex-col sm:flex-row justify-between sm:items-center gap-3";
                    li.innerHTML = `
                        <div class="flex-1">
                            <p class="font-bold text-slate-800">${exp.name}</p>
                            <div class="flex items-center text-sm font-medium text-slate-500 mt-1">
                                <span class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded text-slate-600">${exp.qty}x</span>
                                <span class="mx-2 text-slate-300">|</span>
                                <span>${formatRp(exp.price)}</span>
                            </div>
                        </div>
                        <div class="flex justify-between sm:justify-end items-center sm:w-auto w-full border-t sm:border-0 border-slate-100 pt-3 sm:pt-0">
                            <p class="font-bold text-slate-800 text-base sm:mr-6">${formatRp(subtotal)}</p>
                            <div class="flex space-x-1.5">
                                <button onclick="editExpense('${expId}')" class="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 border border-transparent hover:border-indigo-100 w-8 h-8 rounded flex items-center justify-center transition" title="Edit Item"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteExpense('${expId}')" class="text-slate-400 hover:text-rose-600 hover:bg-rose-50 border border-transparent hover:border-rose-100 w-8 h-8 rounded flex items-center justify-center transition" title="Hapus Item"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    expenseList.appendChild(li);
                }
            }

            const remaining = budget.initialFund - totalUsed;
            const percentageUsed = budget.initialFund > 0 ? (totalUsed / budget.initialFund) * 100 : 0;
            const remainingPercent = budget.initialFund > 0 ? (100 - percentageUsed).toFixed(1) : 0;
            const progressWidth = Math.min(percentageUsed, 100);

            // Update UI Detail Sisa Anggaran
            document.getElementById('detail-remaining').innerText = formatRp(remaining);

            const remCard = document.getElementById('detail-remaining-card');
            const percentText = document.getElementById('detail-percent-text');
            const progressBar = document.getElementById('detail-progress-bar');

            if (remaining < 0) {
                remCard.className = 'p-5 rounded-xl border shadow-sm bg-rose-600 border-rose-700 text-white flex flex-col justify-between';
                percentText.innerHTML = `<span>Overbudget</span> <span>${Math.abs(remainingPercent)}% Minus</span>`;
                percentText.className = 'flex justify-between text-xs font-semibold mb-1.5 text-rose-100 tracking-wide';
                progressBar.parentElement.className = 'w-full bg-rose-800 rounded-md h-1.5 overflow-hidden';
                progressBar.className = 'bg-white h-1.5 rounded-md w-full';
            } else {
                remCard.className = 'p-5 rounded-xl border shadow-sm bg-indigo-600 border-indigo-700 text-white flex flex-col justify-between';
                percentText.innerHTML = `<span>Sisa Dana</span> <span>${remainingPercent}%</span>`;
                percentText.className = 'flex justify-between text-xs font-semibold mb-1.5 text-indigo-100 tracking-wide';
                progressBar.parentElement.className = 'w-full bg-indigo-800 rounded-md h-1.5 overflow-hidden';
                progressBar.className = 'bg-white h-1.5 rounded-md transition-all duration-500';
                progressBar.style.width = progressWidth + '%';
            }
        }

        // Modal Tambah Item Pemakaian
        document.getElementById('btn-add-expense').addEventListener('click', () => {
            Swal.fire({
                title: '<span class="text-xl font-bold">Catat Pengeluaran</span>',
                html: `
                    <div class="text-left mt-4 space-y-4">
                        <div>
                            <label class="text-sm font-semibold text-slate-700">Keperluan</label>
                            <input id="swal-e-name" class="swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300" placeholder="Cth: Cetak Banner">
                        </div>
                        <div class="flex gap-3">
                            <div class="w-1/3">
                                <label class="text-sm font-semibold text-slate-700">Qty</label>
                                <input id="swal-e-qty" type="text" inputmode="numeric" class="format-angka swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300" placeholder="1">
                            </div>
                            <div class="w-2/3">
                                <label class="text-sm font-semibold text-slate-700">Harga Satuan</label>
                                <input id="swal-e-price" type="text" inputmode="numeric" class="format-angka swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300" placeholder="10.000">
                            </div>
                        </div>
                    </div>
                `,
                didOpen: attachNumberFormatEvent,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Simpan Data',
                cancelButtonText: 'Batal',
                customClass: { confirmButton: '!bg-indigo-600 !rounded-lg !px-5', cancelButton: '!bg-white !text-slate-700 !border !border-slate-300 !rounded-lg !px-5' },
                preConfirm: () => {
                    const name = document.getElementById('swal-e-name').value;
                    const qtyStr = document.getElementById('swal-e-qty').value.replace(/\./g, '');
                    const priceStr = document.getElementById('swal-e-price').value.replace(/\./g, '');
                    if (!name || !qtyStr || !priceStr) Swal.showValidationMessage('Lengkapi formulir dengan benar!');
                    return { name, qty: parseInt(qtyStr), price: parseInt(priceStr) }
                }
            }).then((result) => {
                if (result.isConfirmed && currentBudgetId) {
                    const expId = generateId();
                    if (!budgetsData[currentBudgetId].expenses) budgetsData[currentBudgetId].expenses = {};
                    budgetsData[currentBudgetId].expenses[expId] = result.value;
                    saveData();
                }
            });
        });

        // Edit Item Pemakaian
        window.editExpense = (expId) => {
            const exp = budgetsData[currentBudgetId].expenses[expId];
            Swal.fire({
                title: '<span class="text-xl font-bold">Edit Pengeluaran</span>',
                html: `
                    <div class="text-left mt-4 space-y-4">
                        <div>
                            <label class="text-sm font-semibold text-slate-700">Keperluan</label>
                            <input id="swal-e-name" class="swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300" value="${exp.name}">
                        </div>
                        <div class="flex gap-3">
                            <div class="w-1/3">
                                <label class="text-sm font-semibold text-slate-700">Qty</label>
                                <input id="swal-e-qty" type="text" inputmode="numeric" class="format-angka swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300" value="${new Intl.NumberFormat('id-ID').format(exp.qty)}">
                            </div>
                            <div class="w-2/3">
                                <label class="text-sm font-semibold text-slate-700">Harga Satuan</label>
                                <input id="swal-e-price" type="text" inputmode="numeric" class="format-angka swal2-input !w-full !m-0 !mt-1.5 !h-11 !rounded-lg !text-base border-slate-300" value="${new Intl.NumberFormat('id-ID').format(exp.price)}">
                            </div>
                        </div>
                    </div>
                `,
                didOpen: attachNumberFormatEvent,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'Update Data',
                cancelButtonText: 'Batal',
                customClass: { confirmButton: '!bg-indigo-600 !rounded-lg !px-5', cancelButton: '!bg-white !text-slate-700 !border !border-slate-300 !rounded-lg !px-5' },
                preConfirm: () => {
                    const name = document.getElementById('swal-e-name').value;
                    const qtyStr = document.getElementById('swal-e-qty').value.replace(/\./g, '');
                    const priceStr = document.getElementById('swal-e-price').value.replace(/\./g, '');
                    if (!name || !qtyStr || !priceStr) Swal.showValidationMessage('Lengkapi formulir dengan benar!');
                    return { name, qty: parseInt(qtyStr), price: parseInt(priceStr) }
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    budgetsData[currentBudgetId].expenses[expId] = result.value;
                    saveData();
                }
            });
        };

        // Hapus Item Pemakaian
        window.deleteExpense = (expId) => {
            Swal.fire({
                title: 'Hapus Item?',
                text: "Data yang dihapus tidak bisa dikembalikan.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Ya, Hapus',
                cancelButtonText: 'Batal',
                customClass: { confirmButton: '!bg-rose-600 !rounded-lg !px-5', cancelButton: '!bg-white !text-slate-700 !border !border-slate-300 !rounded-lg !px-5 hover:!bg-slate-50' }
            }).then((result) => {
                if (result.isConfirmed) {
                    delete budgetsData[currentBudgetId].expenses[expId];
                    saveData();
                }
            });
        };

        // Initialize Load
        window.onload = loadData;
    </script>
</body>

</html>
